# Synthetic data. Every source answers, with nothing in it: the note still gets its block,
# saying so, rather than keeping yesterday's text. The input is the collect step's output for
# pipelines/daily-brief.yaml on 2026-11-14 (a Saturday) in Europe/Paris.
schema_version: 1
description: Nothing planned gives an empty ranking and a one-line note.
budget: { usd: 0.05, tokens_out: 2000 }
targets:
  note.replace_owned_block: Daily/2026-11-14.assistant.md
input:
  - source: calendar.events
    params: { start: "2026-11-14", days: 2, timezone: Europe/Paris }
    data:
      window: { start: "2026-11-14T00:00:00+01:00", end: "2026-11-16T00:00:00+01:00" }
      complete: true
      truncated: 0
      calendars: [{ name: calendar-1, ok: true, complete: true, events: 0, skipped: 0, truncated: 0, warnings: 0 }]
      events: []
  - source: obsidian.open_tasks
    params: {}
    data: { tasks: [] }
  - source: github.review_requests
    params: { today: "2026-11-14" }
    data: { kind: review_requested, day: "2026-11-14", items: [], truncated: false, skipped: 0, partial: false, errors: 0 }
  - source: github.assigned
    params: { today: "2026-11-14", skip_covered: true }
    data: { kind: assigned, day: "2026-11-14", items: [], truncated: false, skipped: 0, partial: false, errors: 0 }
  - source: github.mentions
    params: { today: "2026-11-14", skip_covered: true }
    data: { kind: mentioned, day: "2026-11-14", items: [], truncated: false, skipped: 0, partial: false, errors: 0 }
expect:
  schema_valid: true
  output:
    summary: Nothing is planned today.
    ranked: []
  intents:
    - type: note.replace_owned_block
      block: daily-brief
      content: "Nothing planned today.\n"
  guard: pass
